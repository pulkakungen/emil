name = "mrs-raccoon-push"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Skapa KV med:  npx wrangler kv namespace create PUSH_KV
# Klistra in id:t som kommandot skriver ut här nedanför.
kv_namespaces = [
  { binding = "PUSH_KV", id = "263f010de8874eca812f1b00662342f5" }
]

# Kör var 15:e minut dygnet runt. Workern filtrerar själv på svensk tid
# och skickar aldrig något mellan 23.45 och 06.15.
[triggers]
# Ett enda schema: var femte minut, plus :58 så att 23.58 svensk tid alltid
# träffas för raden till kalkylarket. Var femte minut gör att kvällens
# hälsning kan läggas på vilken jämn femma som helst och gå på slaget.
# Workern filtrerar själv på svensk lokaltid. Ett schema per app håller oss
# under gratisplanens gräns på fem cron-scheman per konto.
crons = ["0,5,10,15,20,25,30,35,40,45,50,55,58 * * * *"]

# Hemligheter (sätts med `npx wrangler secret put <NAMN>`, skrivs ALDRIG här):
#   VAPID_PRIVATE_KEY
#   VAPID_PUBLIC_KEY
#   VAPID_SUBJECT   (t.ex. "mailto:din@epost.se")
#   ADMIN_TOKEN     (skyddar /admin och /panel)
#   SHEET_URL       (Apps Script-webbappen, valfri)
#   SHEET_TOKEN     (samma ord som TOKEN i skriptet, valfri)
